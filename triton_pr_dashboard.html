<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton Ascend PR效率看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        .stat-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-unit {
            font-size: 0.9rem;
            color: #888;
        }
        
        .open-prs { color: #e74c3c; }
        .submitted-prs { color: #3498db; }
        .merged-prs { color: #27ae60; }
        .failed-prs { color: #e74c3c; }
        .avg-duration { color: #f39c12; }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .pr-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .pr-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .pr-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.1);
        }
        
        .pr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .pr-number {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }
        
        .pr-title {
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .pr-meta {
            font-size: 0.85rem;
            color: #666;
            display: flex;
            gap: 15px;
        }
        
        .duration-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        

        
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 20px; }
            .stat-value { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Triton Ascend PR效率看板</h1>
            <p>实时监控Pull Request提交与合入效率</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">待合入PR</div>
                <div class="stat-value open-prs">89</div>
                <div class="stat-unit">个PR等待处理</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-title">近7天提交</div>
                <div class="stat-value submitted-prs">0</div>
                <div class="stat-unit">个新PR</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-title">近7天合入</div>
                <div class="stat-value merged-prs">0</div>
                <div class="stat-unit">个PR已合入</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-title">近7天失败</div>
                <div class="stat-value failed-prs">0</div>
                <div class="stat-unit">个PR失败 (失败率0%)</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-title">平均合入时长</div>
                <div class="stat-value avg-duration">0.0</div>
                <div class="stat-unit">天 (0.0小时)</div>
            </div>
        </div>
        

        
        <div class="section">
            <h2 class="section-title">📈 近两周每日PR提交活跃度</h2>
            <div style="height: 400px; position: relative;">
                <canvas id="dailyChart"></canvas>
            </div>
            <div style="text-align: center; margin-top: 15px; color: #666; font-size: 0.9rem;">
                横轴：日期 | 纵轴：PR提交数量 | 总计: 0 个PR，失败: 0 个
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title">⚡ 近期合入PR详情</h2>
            <div class="pr-list">
                <div style="text-align: center; color: #666; padding: 40px;">暂无数据</div>
            </div>
        </div>
        
        <div class="footer">
            <p>数据更新时间: 2026-09-02 05:26:19</p>
            <p>基于Gitcode API数据生成</p>
        </div>
    </div>
    
    <script>
        // 添加一些交互效果
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px) scale(1.02)';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });
        
        window.addEventListener('load', function() {
            initDailyChart();
        });
        
        function initDailyChart() {
            const ctx = document.getElementById('dailyChart');
            if (!ctx) return;
            
            // 准备图表数据
            const chartData = {"labels": ["\u65e0\u6570\u636e"], "total_values": [0], "failed_values": [0]};
            const dailyData = {
                labels: chartData.labels,
                totalValues: chartData.total_values,
                failedValues: chartData.failed_values
            };
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dailyData.labels,
                    datasets: [{
                        label: 'PR提交总数',
                        data: dailyData.totalValues,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }, {
                        label: '失败PR数量',
                        data: dailyData.failedValues,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#e74c3c',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: '#667eea',
                            borderWidth: 1,
                            callbacks: {
                                title: function(context) {
                                    return '日期: ' + context[0].label;
                                },
                                label: function(context) {
                                    return '提交数量: ' + context.parsed.y + ' 个PR';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: '日期',
                                color: '#666',
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                display: true,
                                color: 'rgba(0, 0, 0, 0.1)'
                            },
                            ticks: {
                                color: '#666',
                                maxRotation: 45,
                                font: {
                                    size: 10
                                }
                            }
                        },
                        y: {
                            display: true,
                            title: {
                                display: true,
                                text: 'PR提交数量',
                                color: '#666',
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            },
                            beginAtZero: true,
                            grid: {
                                display: true,
                                color: 'rgba(0, 0, 0, 0.1)'
                            },
                            ticks: {
                                color: '#666',
                                font: {
                                    size: 10
                                },
                                stepSize: 1
                            }
                        }
                    },
                    elements: {
                        point: {
                            hoverBackgroundColor: '#667eea'
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
